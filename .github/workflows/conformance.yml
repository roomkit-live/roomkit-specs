name: Conformance traceability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned Python reference
        id: reference
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          commit = json.loads(Path("conformance/evidence.json").read_text())["python_commit"]
          assert isinstance(commit, str) and re.fullmatch(r"[0-9a-f]{40}", commit)
          print(f"commit={commit}")
          PY
      - uses: actions/checkout@v7
        with:
          repository: roomkit-live/roomkit
          ref: ${{ steps.reference.outputs.commit }}
          path: .reference/roomkit
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Checker regressions
        run: uv run --no-project --python ${{ matrix.python }} --with jsonschema==4.26.0 python -m unittest discover -s conformance/tests -v
      - name: Historical scenario checks
        run: uv run --no-project --python ${{ matrix.python }} --with jsonschema==4.26.0 python conformance/check.py --strict
      - name: Current RFC, evidence provenance and generated artifacts
        env:
          TRACEABILITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$TRACEABILITY_BASE" ] || [ "$TRACEABILITY_BASE" = "0000000000000000000000000000000000000000" ]; then
            TRACEABILITY_BASE="$(git rev-parse HEAD^)"
          fi
          uv run --no-project --python ${{ matrix.python }} --with jsonschema==4.26.0 python conformance/check.py --strict --traceability --python-repo .reference/roomkit --base-ref "$TRACEABILITY_BASE"
